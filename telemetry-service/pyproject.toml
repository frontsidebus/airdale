[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airdale-telemetry-service"
version = "1.0.0"
description = "Universal telemetry hub for Airdale sim adapters"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["telemetry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
