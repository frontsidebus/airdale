[project]
name = "web"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "httpx-ws>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring Docker services (deselect with '-m not integration')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
