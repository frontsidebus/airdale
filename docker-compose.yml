# MERLIN - AI Co-Pilot for Flight Simulators
# Docker Compose configuration for local services.
#
# Architecture:
#   Sim Adapters (native exe) → Telemetry Service (Docker) → Orchestrator/Web
#
# The MSFS adapter (C#) runs natively on the Windows host and pushes
# telemetry to the telemetry service via WebSocket.
#
# Usage:
#   docker compose up -d              # start all services
#   docker compose up -d chromadb     # start only ChromaDB
#   docker compose logs -f whisper    # follow whisper logs

services:
  # ---------------------------------------------------------------------------
  # Whisper - Local speech-to-text via faster-whisper HTTP API
  # Provides an OpenAI-compatible /v1/audio/transcriptions endpoint.
  # ---------------------------------------------------------------------------
  whisper:
    image: fedirz/faster-whisper-server:0.8.3-cpu
    container_name: merlin-whisper
    ports:
      - "9090:8000"
    environment:
      - WHISPER__MODEL=${WHISPER_MODEL:-medium}
      - WHISPER__INFERENCE_DEVICE=cpu
    volumes:
      - whisper_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - merlin
    # -------------------------------------------------------------------------
    # GPU acceleration (NVIDIA). Uncomment the lines below and comment out
    # the CPU image above if you have an NVIDIA GPU and nvidia-container-toolkit.
    # See: https://docs.docker.com/compose/gpu-support/
    # -------------------------------------------------------------------------
    # Uncomment for GPU acceleration (requires nvidia-container-toolkit):
    # image: fedirz/faster-whisper-server:0.8.3-cuda
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # ChromaDB - Vector store for RAG (Retrieval-Augmented Generation)
  # Stores aircraft manuals, checklists, and procedures for context retrieval.
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:1.5.5
    container_name: merlin-chromadb
    ports:
      - "8000:8000"
    environment:
      - ANONYMIZED_TELEMETRY=false
      - IS_PERSISTENT=TRUE
    volumes:
      - ./data/chroma_db:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - merlin

  # ---------------------------------------------------------------------------
  # Telemetry Service - Universal telemetry hub
  # Receives telemetry from sim adapters and broadcasts to consumers.
  # ---------------------------------------------------------------------------
  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: merlin-telemetry
    ports:
      - "8080:8080"   # Consumer endpoint (orchestrator, web UI connect here)
      - "8081:8081"   # Adapter ingest endpoint (MSFS adapter pushes here)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - merlin

  # ---------------------------------------------------------------------------
  # Orchestrator - MERLIN's brain
  # Coordinates between Claude, telemetry service, Whisper, and ChromaDB.
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: merlin-orchestrator
    ports:
      - "3838:3838"
    depends_on:
      whisper:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - WHISPER_URL=http://whisper:8000
      - CHROMADB_URL=http://chromadb:8000
      - TELEMETRY_SERVICE_URL=ws://telemetry-service:8080/ws/telemetry
    restart: unless-stopped
    networks:
      - merlin

volumes:
  whisper_cache:
    driver: local

networks:
  merlin:
    name: merlin
    driver: bridge
