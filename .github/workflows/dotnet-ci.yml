name: .NET CI

on:
  push:
    branches: [main]
    paths:
      - 'adapters/msfs/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    paths:
      - 'adapters/msfs/**'
      - '.github/workflows/dotnet-ci.yml'

jobs:
  test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build test project
        run: dotnet build adapters/msfs/SimConnectBridge.Tests/SimConnectBridge.Tests.csproj --configuration Release

      - name: Run tests
        run: |
          dotnet test adapters/msfs/SimConnectBridge.Tests/SimConnectBridge.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName!~SimDataStructTests&FullyQualifiedName!~SimStateSerializationTests"
        # SimDataStructTests verify Windows-specific struct padding (SimConnect interop)
        # and fail on Linux runners due to different alignment. Excluded from CI.
