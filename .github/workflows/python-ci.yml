name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "orchestrator/**"
      - "telemetry-service/**"
      - "web/**"
      - "*.py"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "orchestrator/**"
      - "telemetry-service/**"
      - "web/**"
      - "*.py"
      - ".github/workflows/python-ci.yml"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            orchestrator/pyproject.toml
            telemetry-service/pyproject.toml
            web/requirements.txt

      - name: Install orchestrator dev dependencies
        run: |
          cd orchestrator && pip install -e ".[dev]"

      - name: Install telemetry-service dev dependencies
        run: |
          cd telemetry-service && pip install -e ".[dev]"

      - name: Install web dependencies
        run: |
          pip install -r web/requirements.txt

      - name: Ruff lint
        run: |
          ruff check orchestrator/ telemetry-service/ web/ --config orchestrator/pyproject.toml --extend-ignore SIM105,SIM117,F841,B008,B017,B007,UP041

      - name: Ruff format check
        run: |
          ruff format --check orchestrator/ telemetry-service/ web/ --config orchestrator/pyproject.toml

      - name: Orchestrator tests
        run: |
          cd orchestrator && pytest

      - name: Telemetry service tests
        run: |
          cd telemetry-service && pytest

      - name: Web server tests
        run: |
          pytest web/tests/
        if: hashFiles('web/tests/') != ''

  integration:
    name: Integration Tests
    if: github.event_name == 'pull_request'
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            orchestrator/pyproject.toml

      - name: Install orchestrator dev dependencies
        run: |
          cd orchestrator && pip install -e ".[dev]"

      - name: Start Docker services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d whisper chromadb

      - name: Wait for Whisper health
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:9090/health; do sleep 5; done'

      - name: Wait for ChromaDB health
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/v1/heartbeat; do sleep 2; done'

      - name: Run integration tests
        run: |
          cd orchestrator && pytest -m integration

      - name: Stop Docker services
        if: always()
        run: |
          docker compose down
